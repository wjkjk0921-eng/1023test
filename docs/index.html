<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iris 與 AI4I 智慧診斷與評估報告</title>
  <style>
    /* ============================================
       根容器與全局重置
       ============================================ */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f8fafc;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1, h2, h3 { margin: 0; }

    /* ============================================
       頂部標題
       ============================================ */
    .page-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .page-header h1 {
      font-size: 1.8rem;
      color: #1e293b;
      margin-bottom: 8px;
    }
    .page-header p {
      color: #64748b;
      font-size: 0.95rem;
    }

    /* ============================================
       推論卡片區（兩張卡片並排或單列）
       ============================================ */
    .inference-section {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      padding: 24px;
      margin-bottom: 24px;
    }

    .inference-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      padding: 24px;
      margin-bottom: 24px;
    }

    .inference-card h3 {
      margin: 0 0 16px 0;
      font-size: 1rem;
      color: #1e293b;
    }

    /* Iris 表單 */
    .iris-form .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    .form-group input:focus { outline: none; border-color: #3b82f6; }
    .submit-btn { width: 100%; padding: 0.6rem; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; }
    .submit-btn:hover { background: #2563e7; }

    /* AI4I 表單 */
    .ai4i-form .form-group { margin-bottom: 0.8rem; }
    .ai4i-form .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 500; font-size: 0.9rem; }
    .ai4i-form .form-group input { width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }

    /* ============================================
       模型評估結果表格卡片
       ============================================ */
    .model-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      padding: 24px;
    }
    .model-card h3 {
      margin: 0 0 16px 0;
      font-size: 1rem;
      color: #1e293b;
      text-align: center;
    }
    .model-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0;
    }
    .model-table th, .model-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.9rem;
    }
    .model-table th {
      background: #f1f5f9;
      color: #64748b;
      font-weight: 600;
    }
    .model-table tr { border-bottom: 1px solid #e2e8f0; }
    .model-table .best { color: #059669; font-weight: 600; }

    /* ============================================
       圖片圖表區（垂直排列，絕對禁止 position: absolute）
       ============================================ */
    .gallery-section {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      padding: 24px;
    }
    .gallery-section h3 {
      margin: 0 0 24px 0;
      font-size: 1rem;
      color: #1e293b;
      text-align: center;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .gallery .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 4px -1px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .gallery .card img {
      width: 100%;
      max-width: 700px;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .gallery .card .caption {
      padding: 12px;
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
      background: #f8fafc;
    }

    /* ============================================
       結果顯示區
       ============================================ */
    .result-display {
      margin-top: 24px;
      padding: 16px;
      background: #f1f5f9;
      border-radius: 8px;
      display: none;
    }
    .result-display.active { display: block; }
  </style>
</head>
<body>

  <div class="container">
    <!-- ============================================
       頂部標題
       ============================================ -->
    <header class="page-header">
      <h1>Iris 與 AI4I 智慧診斷與評估報告</h1>
      <p>基於機器學習的花卉分類與工業故障預測系統</p>
    </header>

    <!-- ============================================
       推論卡片區（Iris + AI4I）
       ============================================ -->
    <section class="inference-section">
      <div class="inference-card">
        <h3>🌸 Iris 花朵分類互動表單</h3>
        <div class="iris-form">
          <div class="form-group">
            <label>花萼長度 (cm)</label>
            <input type="number" id="sepal-length" step="0.01" required>
          </div>
          <div class="form-group">
            <label>花萼寬度 (cm)</label>
            <input type="number" id="sepal-width" step="0.01" required>
          </div>
          <div class="form-group">
            <label>花瓣長度 (cm)</label>
            <input type="number" id="petal-length" step="0.01" required>
          </div>
          <div class="form-group">
            <label>花瓣寬度 (cm)</label>
            <input type="number" id="petal-width" step="0.01" required>
          </div>
          <button class="submit-btn" onclick="runIrisInference()">預測類別</button>
        </div>
      </div>

      <div class="inference-card">
        <h2>🔧 AI4I 2020 設備故障預測</h2>
        <div class="ai4i-form">
          <div class="form-group">
            <label>空氣溫度 (K)</label>
            <input type="number" id="air-temp" step="0.01" required>
          </div>
          <div class="form-group">
            <label>製程溫度 (K)</label>
            <input type="number" id="process-temp" step="0.01" required>
          </div>
          <div class="form-group">
            <label>轉速 (rpm)</label>
            <input type="number" id="rotational-speed" step="1" required>
          </div>
          <div class="form-group">
            <label>扭矩 (Nm)</label>
            <input type="number" id="torque" step="0.01" required>
          </div>
          <div class="form-group">
            <label>刀具磨耗 (min)</label>
            <input type="number" id="tool-wear" step="0.1" required>
          </div>
          <button class="submit-btn" onclick="runAI4IInference()">計算故障率</button>
        </div>
      </div>
    </section>

    <!-- ============================================
       模型評估結果表格
       ============================================ -->
    <section class="model-section">
      <div class="model-card">
        <h3>模型效能比較</h3>
        <table class="model-table">
          <thead>
            <tr>
              <th>模型</th>
              <th>準確率</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>MLP</td>
              <td>0.9065 <span class="best">[Best]</span></td>
            </tr>
            <tr>
              <td>Random Forest</td>
              <td>0.8990</td>
            </tr>
            <tr>
              <td>XGBoost</td>
              <td>0.8310</td>
            </tr>
            <tr>
              <td>Logistic Regression</td>
              <td>0.4995</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- ============================================
       圖片圖表區（垂直單行排版，絕對不使用 position: absolute）
       ============================================ -->
    <section class="gallery-section">
      <h3>圖表展示</h3>
      <div class="gallery">
        <!-- PCA 3D 視覺化 -->
        <div class="card">
          <img src="figures/pca_3d_plot.png" alt="PCA 3D 視覺化">
          <div class="caption">PCA 3D 視覺化</div>
        </div>

        <!-- 混淆矩陣 -->
        <div class="card">
          <img src="figures/confusion_matrices.png" alt="混淆矩陣">
          <div class="caption">混淆矩陣</div>
        </div>

        <!-- 相關性熱力圖 -->
        <div class="card">
          <img src="figures/correlation_heatmap.png" alt="相關性熱力圖">
          <div class="caption">相關性熱力圖</div>
        </div>

        <!-- 特徵分佈箱鬚圖 -->
        <div class="card">
          <img src="figures/feature_distribution_boxplots.png" alt="特徵分佈箱鬚圖">
          <div class="caption">特徵分佈箱鬚圖</div>
        </div>

        <!-- 模型比較圖 -->
        <div class="card">
          <img src="figures/model_comparison.png" alt="模型比較圖">
          <div class="caption">模型比較圖</div>
        </div>

        <!-- 故障分佈圖 -->
        <div class="card">
          <img src="figures/failure_distribution.png" alt="故障分佈圖">
          <div class="caption">故障分佈圖</div>
        </div>

        <!-- 訓練曲線 -->
        <div class="card">
          <img src="figures/training_curves.png" alt="訓練曲線">
          <div class="caption">訓練曲線</div>
        </div>
      </div>
    </section>
  </div>

  <!-- ============================================
     讀取 app.js 與 model_params.js 進行推論
       應用於 Iris 與 AI4I 兩個表單
       ============================================ -->
  <script src="app.js" defer></script>

  <script>
    /* ============================================
       讀取 model_results.json 顯示模型評估資訊
       ============================================ */
    document.addEventListener('DOMContentLoaded', function() {
      fetch('results.json')
        .then(response => response.json())
        .then(data => {
          // 這裡可以進一步增強表格資訊，但我們直接寫死準確率已在 HTML 中
          // 若需動態顯示，可在此解析 data.evaluation.models 等欄位
        })
        .catch(error => console.error('Error loading results.json:', error));
    });

    /* ============================================
       Iris 分類互動推論
       ============================================ */
    function runIrisInference() {
      const sepalLength = document.getElementById('sepal-length').value;
      const sepalWidth = document.getElementById('sepal-width').value;
      const petalLength = document.getElementById('petal-length').value;
      const petalWidth = document.getElementById('petal-width').value;

      if (!sepalLength || !sepalWidth || !petalLength || !petalWidth) {
        alert('請填寫所有四個輸入欄位。');
        return;
      }

      const results = inferIris(sepalLength, sepalWidth, petalLength, petalWidth);
      displayIrisResult(results);
    }

    function displayIrisResult(results) {
      const display = document.createElement('div');
      display.className = 'result-display active';
      display.innerHTML = `
        <strong>預測類別:</strong> ${results.class}<br>
        <strong>Setosa 機率:</strong> ${results.probabilities.setosa.toFixed(4)}<br>
        <strong>Versicolor 機率:</strong> ${results.probabilities.versicolor.toFixed(4)}<br>
        <strong>Virginica 機率:</strong> ${results.probabilities.virginica.toFixed(4)}
      `;
      // 將結果顯示在 AI4I 卡片下方或頁尾區塊（此處簡化：在頁面顯示區塊）
      const section = document.querySelector('.inference-section');
      section.appendChild(display);
    }

    /* ============================================
       AI4I 故障預測互動推論
       ============================================ */
    function runAI4IInference() {
      const airTemp = document.getElementById('air-temp').value;
      const processTemp = document.getElementById('process-temp').value;
      const rotationalSpeed = document.getElementById('rotational-speed').value;
      const torque = document.getElementById('torque').value;
      const toolWear = document.getElementById('tool-wear').value;

      if (!airTemp || !processTemp || !rotationalSpeed || !torque || !toolWear) {
        alert('請填寫所有五個輸入欄位。');
        return;
      }

      const results = inferAI4I(airTemp, processTemp, rotationalSpeed, torque, toolWear);
      displayAI4IResult(results);
    }

    function displayAI4IResult(results) {
      const display = document.createElement('div');
      display.className = 'result-display active';
      display.innerHTML = `
        <strong>故障機率:</strong> ${results.failure ? '是' : '否'}<br>
        <strong>無故障機率:</strong> ${results.probabilityNoFailure.toFixed(4)}<br>
        <strong>故障機率:</strong> ${results.probabilityFailure.toFixed(4)}<br>
        <strong>信心度:</strong> ${(results.confidence * 100).toFixed(2)}%
      `;
      const section = document.querySelector('.inference-section');
      section.appendChild(display);
    }
  </script>
</div>
</body>
</html>
